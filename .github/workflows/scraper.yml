name: Scraper AgriScan

on:
  schedule:
    - cron: '0 2 * * *'  # chaque nuit à 2h UTC
  workflow_dispatch:  # permet aussi un lancement manuel depuis GitHub

# Un seul scrape à la fois : un lancement manuel pendant que le cron (ou un
# autre lancement manuel) tourne encore attend la fin du run en cours au lieu
# de s'exécuter en parallèle (évite les écritures concurrentes sur Neon/Qdrant).
concurrency:
  group: scraper-agriscan
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - run: python scraper.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
