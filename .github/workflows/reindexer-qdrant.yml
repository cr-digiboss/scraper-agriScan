name: Réindexer Qdrant

# Lancement manuel : réindexe tout le catalogue de la base de production dans Qdrant
# (remplace l'ancien « Backfill Qdrant »). Sans risque de doublon : les points sont
# identifiés par marque + nom + variante.
on:
  workflow_dispatch:

concurrency:
  group: scraper-agriscan
  cancel-in-progress: false

jobs:
  reindexer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python -m scraper_bis.indexation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
